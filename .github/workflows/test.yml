---
name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
      - "!releases/**"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Load software versions
        run: sed -n 's/^export //p' versions.env >> "$GITHUB_ENV"
      - name: Check generated version files
        run: make check-versions
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: ./tests/run_tests.sh
        env:
          CGO_ENABLED: 0
      # run staticcheck
      - uses: reviewdog/action-staticcheck@8628bbf0797ad63e854c120a9e59a7100ae25ff0 # v1.31.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Change reviewdog reporter if you need [github-pr-check,github-check,github-pr-review].
          reporter: github-pr-review
          # Report all results.
          filter_mode: nofilter
          # Exit with 1 when it finds at least one finding.
          fail_level: error
          # Build with the configured Go version, which supports this project's Go version.
          use_go_install: true
