---
name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
      - "!releases/**"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # reviewdog (staticcheck) posts review comments
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load software versions
        run: sed -n 's/^export //p' versions.env >> "$GITHUB_ENV"
      - name: Check generated version files
        run: make check-versions
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: ./tests/run_tests.sh
        env:
          CGO_ENABLED: 0
      # run staticcheck
      - uses: reviewdog/action-staticcheck@53efac7da6eead83fb445fc490fef0b7ea57eeb1 # v1.31.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Change reviewdog reporter if you need [github-pr-check,github-check,github-pr-review].
          reporter: github-pr-review
          # PRs fail on findings in changed lines; other runs report all results.
          filter_mode: ${{ github.event_name == 'pull_request' && 'added' || 'nofilter' }}
          # Exit with 1 when it finds at least one finding.
          fail_level: error
          # Build with the configured Go version, which supports this project's Go version.
          use_go_install: true

  race:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load software versions
        run: sed -n 's/^export //p' versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # the race detector needs cgo; the coverage job above runs with CGO_ENABLED=0
      - run: ./tests/run_tests.sh --race
        env:
          CGO_ENABLED: 1
